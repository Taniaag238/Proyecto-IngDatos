global
    log stdout format raw local0
    nbthread 1
    hard-stop-after 3s
    external-check preserve-env
    insecure-fork-wanted

defaults
    log global
    mode tcp
    timeout connect 3s
    timeout check 3s
    timeout client 1h
    timeout server 1h

frontend writer
    bind :5432
    default_backend postgres_writer

resolvers docker_dns
    nameserver docker 127.0.0.11:53
    timeout resolve 1s
    hold valid 5s

backend postgres_writer
    option external-check
    external-check path /usr/lib/postgresql/17/bin:/usr/bin:/bin
    external-check command /usr/local/bin/check-primary
    default-server check inter 2s fall 1 rise 1 on-marked-down shutdown-sessions init-addr last,libc,none resolvers docker_dns
    server pg1 "${PG_NODE1_HOST}:${PG_NODE1_PORT}"
    server pg2 "${PG_NODE2_HOST}:${PG_NODE2_PORT}"
